name: Rom Poster Bot

on:
  push:
    branches:
      - "17"
    paths:
      - "devices/gms/*.json"
      - "devices/vanilla/*.json"
  workflow_dispatch:

concurrency:
  group: post-bot
  cancel-in-progress: false

env:
  GitHubMail: "persesx3@gmail.com"
  GitHubName: "CloverProject-bot"
  GH_TOKEN: ${{ secrets.GH_TOKEN }}
  BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
  CHAT_IDS: ${{ secrets.CHAT_IDS }}
  PRIV_CHAT_ID: ${{ secrets.PRIV_CHAT_ID }}

jobs:
  post:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Dependencies
        run: pip install romkit==1.0.2 noobstuffs

      - name: Build Post Feed
        run: python .github/scripts/build_post_feed.py

      - name: Run RomPosterBot
        run: python .github/scripts/post.py

      - name: Commit and Push Changes
        run: |
          if [[ ! -f commit_mesg.txt ]]; then
            echo "No updates detected. Skipping commit."
            exit 0
          fi
          git config user.email "${GitHubMail}"
          git config user.name "${GitHubName}"
          git add .github/scripts/file_ids.txt
          git commit -s -F commit_mesg.txt
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
