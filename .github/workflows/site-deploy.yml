name: Site deploy

on:
  push:
    branches:
      - "17"
    paths:
      - "site/**"
      - "devices/**"
      - "changelogs/**"
  workflow_dispatch:

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger site build
        env:
          SITE_DEPLOY_HOOK: ${{ secrets.SITE_DEPLOY_HOOK }}
        run: |
          if [ -z "${SITE_DEPLOY_HOOK}" ]; then
            echo "SITE_DEPLOY_HOOK secret is not set"
            exit 1
          fi
          curl -fsS -X POST "${SITE_DEPLOY_HOOK}"
