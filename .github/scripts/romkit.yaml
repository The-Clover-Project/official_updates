bot_username: "cloverpost_bot"

rom_name: "TheCloverProject"

website_url: "https://thecloverproject.com"

json_directories:
  Dir: "./.post"

device_json_structure: {
  "response": [
    {
      "datetime": ,
      "filename": "",
      "id": "",
      "size": ,
      "url": "",
      "version": "",
      "devicename": "",
      "maintainer": "",
      "telegram": "",
      "variants": ""
    }
  ]
}

id_field: "id"

message_template: |
  #CloverProject #{bot_codename} #bka
  The Clover Project v{version} | OFFICIAL
  📲 : {devicename} ({bot_codename})
  📅 : {datetime | dateformat("%d-%b-%Y")}
  🧩 : {variants}
  🧑‍💼 : {% if telegram %}[{maintainer}]({telegram}){% else %}{maintainer}{% endif %}

  [[Download | {website_url}/download/{bot_codename}]]

file_ids_path: "./.github/scripts/file_ids.txt"

banner_path: "./assets/banner.png"

version_repo: "The-Clover-Project/vendor_clover"
version_file: "config/version.mk"
version_template: "{PRODUCT_VERSION_MAJOR}.{PRODUCT_VERSION_MINOR}"
version_field: "version"

device_name_field: "devicename"
maintainer_name_field: "maintainer"
maintainer_telegram_field: "telegram"
